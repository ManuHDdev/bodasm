# ═══════════════════════════════════════════════════════════════
#  Virtualhost nginx para la invitación de boda J&S
#  Copiar este fichero al servidor:
#    sudo cp nginx-vhost.conf /etc/nginx/sites-available/boda
#
#  Pasos después de copiar:
#    1. Reemplazar bodasm.duckdns.org por el dominio real (ej: boda.ejemplo.com)
#    2. Activar el sitio:
#         sudo ln -s /etc/nginx/sites-available/boda /etc/nginx/sites-enabled/boda
#    3. Verificar la configuración:
#         sudo nginx -t
#    4. Obtener certificado SSL con Certbot (NO afecta a otros virtualhosts):
#         sudo certbot --nginx -d bodasm.duckdns.org
#    5. Recargar nginx:
#         sudo systemctl reload nginx
#
#  Certbot modificará automáticamente este fichero para añadir
#  el bloque HTTPS (listen 443) y la redirección 80→443.
#  Los certificados y virtualhosts existentes NO se ven afectados.
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name bodasm.duckdns.org;

    location / {
        proxy_pass         http://127.0.0.1:3080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
