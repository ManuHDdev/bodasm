server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip (text/html ya lo activa nginx por defecto, no repetir)
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # Resolver DNS interno de Docker (resuelve en cada petición, no solo al arrancar)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:3001;

    # Proxy API hacia el contenedor backend
    # Con variable en proxy_pass la URI se pasa completa sin reescritura de prefijo
    location /api/ {
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre → cache 1 año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html: sin cache para que el navegador recargue siempre
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA: todas las rutas devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
